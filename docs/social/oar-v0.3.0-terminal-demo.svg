  <text x="78" y="472" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#94a3b8">Model fallback: xai/grok-4.5</text>
  <text x="78" y="507" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#94a3b8">→ chatgpt-subscription/gpt-6-astra (billing)</text>
  <text x="78" y="557" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30" font-weight="700" fill="url(#accent)">GROK_ASTRA_PRESET_OK</text>

  <text x="600" y="602" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#64748b">Stop: auth · prompt · tool · local · invalid-argument</text>
