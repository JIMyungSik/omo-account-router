  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <rect x="40" y="36" width="1120" height="603" rx="22" fill="#090f1a" stroke="#334155" stroke-width="2"/>
  <circle cx="78" cy="72" r="8" fill="#fb7185"/>
  <circle cx="104" cy="72" r="8" fill="#fbbf24"/>
  <circle cx="130" cy="72" r="8" fill="#34d399"/>
  <text x="600" y="80" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#64748b">OAR v0.3.0 · account first, model second</text>

  <text x="78" y="145" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="27" fill="#94a3b8">$ /model-preset use grok-astra</text>
  <text x="78" y="195" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="27" fill="#22d3ee">1  xAI/main 0%  →  xAI/sub with quota</text>
  <text x="78" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#64748b">   same provider · same Grok model · one bounded retry</text>

  <line x1="78" y1="278" x2="1122" y2="278" stroke="#1e293b" stroke-width="2"/>

  <text x="78" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="27" fill="#a78bfa">2  all eligible xAI accounts exhausted</text>
  <text x="78" y="370" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#64748b">   only then: chatgpt-subscription/gpt-6-astra:high</text>
  <text x="78" y="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#64748b">   then: deepinfra/deepseek-ai/DeepSeek-V4.1-Flash:high</text>

